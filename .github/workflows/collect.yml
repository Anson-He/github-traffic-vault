name: Collect repository traffic
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traffic-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect official GitHub metrics
        id: collect
        continue-on-error: true
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/collect.py
      - name: Commit collected data, including partial results
        if: always()
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive repository traffic $(date -u +%F)"
          git push
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection incomplete. Inspect logs and data/runs; check TRAFFIC_TOKEN permissions/expiry.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
